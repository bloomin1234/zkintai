<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  :root{--ink:#1A1A1A; --sub:#6B6963; --line:#D6D4CE; --bg:#F2F1ED; --sfc:#FBFAF7; color-scheme:light;}
  *{box-sizing:border-box; border-radius:0; margin:0; padding:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;}
  html{background:var(--bg);}
  body{background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column;}
  .hd{background:#1F1F1D; color:#fff; padding:10px 14px; flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .hd .b{font-size:10px; letter-spacing:.14em; opacity:.75;}
  .hd .t{font-size:15px; font-weight:700; margin-top:1px;}
  select{border:1px solid #6B6963; background:#2C2B29; color:#fff; font-size:15px; font-weight:700;
    padding:10px 12px; cursor:pointer; max-width:100%;}
  iframe{flex:1; width:100%; border:none; background:var(--bg); display:none;}
  iframe.on{display:block;}
</style>
</head>
<body>
  <div class="hd">
    <div>
      <div class="b">SMART ORDER × SMART STOCK ｜ FC統合運営基盤</div>
      <div class="t">操作デモ</div>
    </div>
    <select onchange="sw(this.value)" aria-label="画面切替">
      <option value="f1">加盟店アプリ（スマホ）</option>
      <option value="f2">SVアプリ（スマホ）</option>
      <option value="f3">本部・SV管理（PC）</option>
    </select>
  </div>
  <iframe id="f1" class="on" srcdoc="<!DOCTYPE html>
<html lang=&quot;ja&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0, viewport-fit=cover&quot;>
<title>FC統合運営基盤 モバイルモック（加盟店）</title>
<style>
  :root{
    --so:#1F1F1D; --ss:#3A3936; --amber:#8A8781; --red:#B3261E; --bar:#B0AEA7; --barcur:#1A1A1A;
    --ink:#1A1A1A; --sub:#666; --line:#D6D4CE; --bg:#F2F1ED; --white:#FBFAF7;
    --frame:#E4E3DE; --ambbg:#EFEEE8; --ssbg:#ECEBE6; --faint:#B4B2AB;
    --so-t:#1A1A1A; --amb-t:#6B6963; --red-t:#B3261E; --ss-t:#4A4843;
    color-scheme: light;
  }
  :root[data-theme=&quot;dark&quot;]{
      --ink:#EFEBE0; --sub:#A9A18D; --line:#46402F; --bg:#23201A; --white:#2C2921;
      --frame:#181613; --ambbg:#3A311C; --ssbg:#262B26; --faint:#6E685A;
      --so-t:#E8E6E0; --amb-t:#B9B7B0; --red-t:#F09287; --ss-t:#C9C7C0;
      --so:#55534C; --ss:#66645C; --amber:#7A7871; --bar:#5F5D55; --barcur:#EFEBE0;
      color-scheme: dark;
  }
  *{box-sizing:border-box; border-radius:0; margin:0; padding:0;
    font-family:&quot;Hiragino Kaku Gothic ProN&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif;}
  html,body{background:var(--frame);}
  main{background:var(--bg);}
  .phone{max-width:420px; margin:0 auto; background:var(--bg); min-height:100vh;
    display:flex; flex-direction:column; border-left:1px solid var(--line); border-right:1px solid var(--line); color:var(--ink);}

  /* ---------- header ---------- */
  .hd{background:var(--so); color:#fff; padding:13.5px 15.5px 11.5px;}
  .hd .brand{font-size:11.5px; letter-spacing:.18em; opacity:.85;}
  .hd .row{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .hd .store{font-size:17.5px; font-weight:700;}
  .hd .bell{position:relative; width:26px; height:26px;}
  .hd .bell svg{width:22px; height:22px; fill:none; stroke:#fff; stroke-width:1.6;}
  .tgl-theme{border:1px solid rgba(255,255,255,.55); background:none; color:#fff;
    font-size:11.5px; font-weight:700; padding:4px 9.5px; white-space:nowrap;}
  .hd .badge{position:absolute; top:-4px; right:-6px; background:var(--amber); color:#fff;
    font-size:11.5px; font-weight:700; min-width:17.5px; height:17.5px; line-height:17.5px; text-align:center;}

  main{flex:1; overflow-y:auto; padding-bottom:9.5px;}
  .screen{display:none;}
  .screen.on{display:block;}

  .sec{padding:13.5px 15.5px 4px;}
  .label{font-size:12.5px; letter-spacing:.14em; color:var(--sub); font-weight:700; margin-bottom:6px;}
  .card{background:var(--white); border:1px solid var(--line); margin-bottom:11.5px;}

  /* ---------- home ---------- */
  .deadline{border-left:4px solid var(--red); padding:13.5px;}
  .deadline .t{font-size:13.5px; color:var(--sub);}
  .deadline .v{font-size:19.5px; font-weight:700; margin-top:2px;}
  .deadline .v em{font-style:normal; color:var(--amber);}
  .stat3{display:flex; border:1px solid var(--line); background:var(--white); margin:0 15.5px 11.5px;}
  .stat3 > div{flex:1; text-align:center; padding:11.5px 4px; border-right:1px solid var(--line);}
  .stat3 > div:last-child{border-right:none;}
  .stat3 .n{font-size:22px; font-weight:700;}
  .stat3 .n.red{color:var(--red-t);} .stat3 .n.amb{color:var(--amb-t);}
  .stat3 .k{font-size:11.5px; color:var(--sub); margin-top:2px;}
  .notice{padding:11.5px 13.5px; border-bottom:1px solid var(--line); display:flex; gap:9.5px; align-items:flex-start;}
  .notice:last-child{border-bottom:none;}
  .tag{font-size:11.5px; font-weight:700; color:#fff; padding:2px 6px; white-space:nowrap;}
  .tag.hq{background:var(--so);} .tag.req{background:var(--amber);} .tag.sv{background:var(--ss);}
  .notice .tx{font-size:14.5px; line-height:1.5;}
  .notice .due{font-size:12.5px; color:var(--red-t); font-weight:700;}
  .notice.unread .tx{font-weight:700;}
  .qa{display:grid; grid-template-columns:1fr 1fr; gap:9.5px; padding:0 15.5px 13.5px;}
  .qa button{border:1px solid var(--so); background:var(--white); color:var(--so-t);
    font-size:14.5px; font-weight:700; padding:13.5px 4px;}
  .qa button.fill{background:var(--so); color:#fff;}

  /* ---------- order ---------- */
  .datebar{display:flex; gap:9.5px; padding:13.5px 15.5px 4px;}
  .datebar button{flex:1; border:1px solid var(--line); background:var(--white); padding:9.5px 2px; font-size:13.5px; color:var(--ink);}
  .datebar button.on{border-color:var(--so); background:var(--so); color:#fff; font-weight:700;}
  .cutoff{margin:9.5px 15.5px; border:1px solid var(--red); background:var(--ambbg); color:var(--red-t);
    font-size:13.5px; font-weight:700; padding:9.5px 11.5px;}
  .item{display:flex; align-items:center; justify-content:space-between; padding:11.5px 13.5px; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .nm{font-size:14.5px; font-weight:700;}
  .item .sp{font-size:12.5px; color:var(--sub); margin-top:2px;}
  .step{display:flex; align-items:center; border:1px solid var(--line);}
  .step button{width:34px; height:34px; background:var(--white); border:none; font-size:19.5px; color:var(--so-t); font-weight:700;}
  .step .q{width:40px; text-align:center; font-size:15.5px; font-weight:700; border-left:1px solid var(--line); border-right:1px solid var(--line); line-height:34px;}
  .step .q.zero{color:var(--faint); font-weight:400;}
  .total{display:flex; justify-content:space-between; align-items:center; padding:13.5px; border-top:2px solid var(--so); background:var(--white); margin:0 15.5px 11.5px; border-left:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
  .total .k{font-size:13.5px; color:var(--sub);}
  .total .v{font-size:19.5px; font-weight:700;}
  .cta{display:block; width:calc(100% - 28px); margin:0 15.5px 9.5px; padding:15.5px; border:none;
    background:var(--so); color:#fff; font-size:16.5px; font-weight:700;}
  .cta.ghost{background:var(--white); color:var(--so-t); border:1px solid var(--so);}

  /* ---------- qsc ---------- */
  .prev{border-left:4px solid var(--amber); padding:11.5px 13.5px;}
  .prev .t{font-size:12.5px; font-weight:700; color:var(--amb-t);}
  .prev .tx{font-size:13.5px; margin-top:4px; line-height:1.5;}
  .q-item{padding:11.5px 13.5px; border-bottom:1px solid var(--line);}
  .q-item:last-child{border-bottom:none;}
  .q-item .qq{font-size:14.5px; font-weight:700;}
  .chips{display:flex; gap:6px; margin-top:9.5px;}
  .chips button{flex:1; height:32px; border:1px solid var(--line); background:var(--white); font-size:14.5px; color:var(--ink);}
  .chips button.on{background:var(--so); border-color:var(--so); color:#fff; font-weight:700;}
  .photo{border:1px dashed var(--sub); color:var(--sub); text-align:center; padding:17.5px 9.5px; font-size:13.5px; margin-top:9.5px;}
  textarea{width:100%; border:1px solid var(--line); padding:9.5px; font-size:14.5px; margin-top:9.5px; min-height:120px; line-height:1.6; resize:vertical; background:var(--white); color:var(--ink);}

  /* ---------- tasks ---------- */
  .task{padding:13.5px;}
  .task .hd2{display:flex; justify-content:space-between; align-items:flex-start; gap:9.5px;}
  .task .ti{font-size:14.5px; font-weight:700; line-height:1.45;}
  .pill{font-size:11.5px; font-weight:700; padding:2px 6px; color:#fff; white-space:nowrap;}
  .pill.over{background:var(--red);} .pill.open{background:var(--amber);} .pill.done{background:var(--sub);}
  .meta{display:flex; gap:13.5px; font-size:12.5px; color:var(--sub); margin-top:6px;}
  .meta b{color:var(--ink);}
  .meta .over{color:var(--red-t); font-weight:700;}
  .svc{border-left:3px solid var(--ss); background:var(--ssbg); font-size:13.5px; padding:9.5px 11.5px; margin-top:9.5px; line-height:1.5;}
  .task .btns{display:flex; gap:9.5px; margin-top:11.5px;}
  .task .btns button{flex:1; padding:11.5px 4px; font-size:13.5px; font-weight:700; border:1px solid var(--so); background:var(--white); color:var(--so-t);}
  .task .btns button.fill{background:var(--so); color:#fff;}
  .task.done-card{opacity:.55;}

  /* ---------- bottom nav + black band ---------- */
  .nav-wrap{position:sticky; bottom:0;}
  nav{display:flex; background:var(--white); border-top:1px solid var(--line);}
  nav button{flex:1; padding:14px 0 12px; border:none; background:none; color:var(--sub); font-size:13px; font-weight:700;}
  nav button svg{display:block; margin:0 auto 4px; width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.7;}
  nav button.on{color:var(--so-t);}
  nav button .nbadge{position:relative;}
  .band{height:calc(11.5px + env(safe-area-inset-bottom)); background:#111;}

  .note{font-size:11.5px; color:var(--sub); text-align:center; padding:6px 0 11.5px;}
</style>
</head>
<body>
<div class=&quot;phone&quot;>

  <div class=&quot;hd&quot;>
    <div class=&quot;brand&quot;>SMART ORDER ｜ FC統合運営基盤</div>
    <div class=&quot;row&quot;>
      <div class=&quot;store&quot;>○○フーズ 旗の台店</div>
      <div style=&quot;display:flex; align-items:center; gap:13.5px;&quot;>
        <button class=&quot;tgl-theme&quot; onclick=&quot;toggleTheme()&quot;>☾ ダーク</button>
        <div class=&quot;bell&quot;>
          <svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6&quot;/><path d=&quot;M10 20a2 2 0 0 0 4 0&quot;/></svg>
          <span class=&quot;badge&quot;>3</span>
        </div>
      </div>
    </div>
  </div>

  <main>

    <!-- ===== HOME ===== -->
    <section class=&quot;screen on&quot; id=&quot;scr-home&quot;>
      <div class=&quot;sec&quot;>
        <div class=&quot;label&quot;>本日の発注</div>
        <div class=&quot;card deadline&quot;>
          <div class=&quot;t&quot;>8/21（金）納品分の締切</div>
          <div class=&quot;v&quot;>本日 15:00 <em>／ 残り 2時間14分</em></div>
        </div>
      </div>
      <div class=&quot;stat3&quot;>
        <div><div class=&quot;n amb&quot;>3</div><div class=&quot;k&quot;>未読通知</div></div>
        <div><div class=&quot;n red&quot;>未</div><div class=&quot;k&quot;>今週のQSC</div></div>
        <div><div class=&quot;n red&quot;>2</div><div class=&quot;k&quot;>未完了課題<br>（超過1）</div></div>
      </div>
      <div class=&quot;sec&quot;>
        <div class=&quot;label&quot;>本部からのお知らせ</div>
        <div class=&quot;card&quot;>
          <div class=&quot;notice unread&quot;><span class=&quot;tag req&quot;>要回答</span>
            <div class=&quot;tx&quot;>9月キャンペーン「温玉豚丼」販促物の設置確認 <span class=&quot;due&quot;>回答期限 8/21</span></div></div>
          <div class=&quot;notice unread&quot;><span class=&quot;tag hq&quot;>本部</span>
            <div class=&quot;tx&quot;>丼たれの規格変更について（8/25納品分から）</div></div>
          <div class=&quot;notice unread&quot;><span class=&quot;tag hq&quot;>本部</span>
            <div class=&quot;tx&quot;>改訂版 調理マニュアル v3.2 を配信しました</div></div>
          <div class=&quot;notice&quot;><span class=&quot;tag sv&quot;>SV</span>
            <div class=&quot;tx&quot;>8/26（水）定期訪問の事前チェックのお願い</div></div>
        </div>
      </div>
      <div class=&quot;qa&quot;>
        <button class=&quot;fill&quot; onclick=&quot;go('order')&quot;>発注をはじめる</button>
        <button onclick=&quot;go('qsc')&quot;>QSCを提出する</button>
      </div>
    </section>

    <!-- ===== ORDER ===== -->
    <section class=&quot;screen&quot; id=&quot;scr-order&quot;>
      <div class=&quot;datebar&quot;>
        <button class=&quot;on&quot;>8/21（金）</button>
        <button>8/22（土）</button>
        <button>8/24（月）</button>
      </div>
      <div class=&quot;cutoff&quot;>この納品日の締切：本日 15:00（締切後は本部へ電話連絡）</div>
      <div class=&quot;sec&quot;>
        <div class=&quot;label&quot;>定番品目</div>
        <div class=&quot;card&quot;>
          <div class=&quot;item&quot;><div><div class=&quot;nm&quot;>豚ローススライス 2mm</div><div class=&quot;sp&quot;>1kg×10 ／ ¥8,900</div></div>
            <div class=&quot;step&quot;><button>−</button><div class=&quot;q&quot;>3</div><button>＋</button></div></div>
          <div class=&quot;item&quot;><div><div class=&quot;nm&quot;>丼たれ（専用）</div><div class=&quot;sp&quot;>1.8L×6 ／ ¥5,400</div></div>
            <div class=&quot;step&quot;><button>−</button><div class=&quot;q&quot;>1</div><button>＋</button></div></div>
          <div class=&quot;item&quot;><div><div class=&quot;nm&quot;>精米 ゆめぴりか</div><div class=&quot;sp&quot;>10kg ／ ¥4,600</div></div>
            <div class=&quot;step&quot;><button>−</button><div class=&quot;q&quot;>2</div><button>＋</button></div></div>
          <div class=&quot;item&quot;><div><div class=&quot;nm&quot;>玉ねぎ</div><div class=&quot;sp&quot;>10kg箱 ／ ¥2,300</div></div>
            <div class=&quot;step&quot;><button>−</button><div class=&quot;q zero&quot;>0</div><button>＋</button></div></div>
          <div class=&quot;item&quot;><div><div class=&quot;nm&quot;>丼容器 M（フタ付）</div><div class=&quot;sp&quot;>50個×4 ／ ¥3,800</div></div>
            <div class=&quot;step&quot;><button>−</button><div class=&quot;q&quot;>1</div><button>＋</button></div></div>
          <div class=&quot;item&quot;><div><div class=&quot;nm&quot;>紅生姜</div><div class=&quot;sp&quot;>1kg×10 ／ ¥6,200</div></div>
            <div class=&quot;step&quot;><button>−</button><div class=&quot;q zero&quot;>0</div><button>＋</button></div></div>
        </div>
      </div>
      <div class=&quot;total&quot;><span class=&quot;k&quot;>7品目・数量計 7 ｜ 合計（税抜）</span><span class=&quot;v&quot;>¥46,300</span></div>
      <button class=&quot;cta ghost&quot;>前回発注をコピー</button>
      <button class=&quot;cta&quot;>この内容で注文を確定する</button>
      <div class=&quot;note&quot;>確定後も締切までは変更・取消できます（履歴は本部に記録されます）</div>
    </section>

    <!-- ===== QSC ===== -->
    <section class=&quot;screen&quot; id=&quot;scr-qsc&quot;>
      <div class=&quot;sec&quot;>
        <div class=&quot;label&quot;>週次QSCチェック（8月 第3週）</div>
        <div class=&quot;card prev&quot;>
          <div class=&quot;t&quot;>前回指摘（8月 第2週・SV点検）</div>
          <div class=&quot;tx&quot;>冷蔵庫内の温度記録が2日分未記入。是正タスクNo.128として登録済み。</div>
        </div>
        <div class=&quot;label&quot;>Q：品質・味</div>
        <div class=&quot;card&quot;>
          <div class=&quot;q-item&quot;><div class=&quot;qq&quot;>1. 豚の盛付量が規定どおりである（並120g／大盛180g・計量確認）</div>
            <div class=&quot;chips&quot;><button>1</button><button>2</button><button>3</button><button class=&quot;on&quot;>4</button><button>5</button></div></div>
          <div class=&quot;q-item&quot;><div class=&quot;qq&quot;>2. たれの計量（1杯40ml）と照りが基準写真どおりである</div>
            <div class=&quot;chips&quot;><button>1</button><button>2</button><button>3</button><button>4</button><button class=&quot;on&quot;>5</button></div></div>
        </div>
        <div class=&quot;label&quot;>C：清潔・衛生</div>
        <div class=&quot;card&quot;>
          <div class=&quot;q-item&quot;><div class=&quot;qq&quot;>3. 豚肉の保管温度（4℃以下）と冷蔵庫の温度記録が毎日記入されている</div>
            <div class=&quot;chips&quot;><button>1</button><button>2</button><button class=&quot;on&quot;>3</button><button>4</button><button>5</button></div>
            <div class=&quot;photo&quot;>＋ 温度記録表の写真を添付（必須）</div></div>
          <div class=&quot;q-item&quot;><div class=&quot;qq&quot;>4. スライサー・まな板の生肉／野菜区分と洗浄消毒ができている</div>
            <div class=&quot;chips&quot;><button>1</button><button>2</button><button>3</button><button class=&quot;on&quot;>4</button><button>5</button></div></div>
        </div>
        <div class=&quot;label&quot;>S：サービス</div>
        <div class=&quot;card&quot;>
          <div class=&quot;q-item&quot;><div class=&quot;qq&quot;>5. 提供時間（券売機発券から5分以内）を守れている</div>
            <div class=&quot;chips&quot;><button>1</button><button>2</button><button>3</button><button class=&quot;on&quot;>4</button><button>5</button></div>
            <textarea placeholder=&quot;コメント（任意）：ピーク時に6分かかるケースあり&quot;></textarea></div>
        </div>
      </div>
      <button class=&quot;cta&quot;>QSCチェックを提出する</button>
      <div class=&quot;note&quot;>提出後はSV・本部が内容を確認します。基準未達の項目は自動で課題化されます。</div>
    </section>

    <!-- ===== TASKS ===== -->
    <section class=&quot;screen&quot; id=&quot;scr-task&quot;>
      <div class=&quot;sec&quot;>
        <div class=&quot;label&quot;>未完了の改善タスク（2件）</div>
        <div class=&quot;card task&quot;>
          <div class=&quot;hd2&quot;><div class=&quot;ti&quot;>No.128 冷蔵庫内の温度記録が未実施</div><span class=&quot;pill over&quot;>期限超過</span></div>
          <div class=&quot;meta&quot;><span>責任者 <b>店長</b></span><span class=&quot;over&quot;>期限 8/18（超過2日）</span><span>優先度 高</span></div>
          <div class=&quot;svc&quot;>SV：記録表を冷蔵庫扉に移設し、開店前チェックに組み込んでください。改善後の写真を証跡として提出をお願いします。</div>
          <div class=&quot;btns&quot;><button>証跡写真を追加</button><button class=&quot;fill&quot;>完了を申請する</button></div>
        </div>

<script>
const titles={
  dash:'本部ダッシュボード ― 8/19（水）',
  agg:'注文集約・供給連携 ― 納品日 8/21（金）',
  karte:'SV店舗カルテ ― 旗の台店',
  cklst:'チェックリスト設定（評価項目マスタ）',
  svmgr:'SV管理・招待'
};
function toggleTheme(){
  const r=document.documentElement;
  const dark = r.getAttribute('data-theme')==='dark';
  if(dark){ r.removeAttribute('data-theme'); } else { r.setAttribute('data-theme','dark'); }
  document.querySelectorAll('.tgl-theme').forEach(b=>b.textContent = dark ? '☾ ダーク' : '☀ ライト');
}
function go(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));
  document.getElementById('pg-'+p).classList.add('on');
  document.querySelectorAll('aside .menu button').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
  document.querySelectorAll('.mnav button').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
  document.getElementById('ttl').textContent=titles[p];
  window.scrollTo(0,0);
}
/* グラフはタップでも詳細表示（モバイル必須要件） */
document.querySelectorAll('.bars .b, .qsc-row .tr2').forEach(el=>{
  el.addEventListener('click', (e)=>{
    const was = el.classList.contains('show');
    document.querySelectorAll('.show').forEach(x=>x.classList.remove('show'));
    if(!was) el.classList.add('show');
    e.stopPropagation();
  });
});
document.addEventListener('click', ()=>document.querySelectorAll('.show').forEach(x=>x.classList.remove('show')));
</script>
