<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商品BOM構成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --base:#F2F2EF; --panel:#FFFFFF; --panel2:#F7F7F5; --row:#FFFFFF;
  --ink:#222222; --muted:#767672; --line:#E2E2DE; --hair:#ECECE8;
  --green:#2E9E6B; --amber:#E8923A; --red:#D9534F;
  --onacc:#FFFFFF; --sel:#EAF6EF; --dupbg:#FFF6E8; --focus:#2E9E6B;
  --navy:#2E9E6B; --c-pr:#2E9E6B; --c-raw:#222; --c-im:#222; --c-pm:#222; --c-pk:#222;
  --t-pr:#EAF6EF; --t-raw:#F7F7F5; --t-im:#F7F7F5; --t-pm:#F7F7F5; --t-pk:#F7F7F5;
  --r:10px;
  --font:"M PLUS Rounded 1c","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--base)}
body{margin:0;background:var(--base);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(46,158,107,.35);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.hide{display:none!important}
.app{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--base)}

/* ===== top ===== */
.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.top-in{padding:12px 18px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:17px;font-weight:800}
.brand .sub{font-size:12px;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mode{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.navrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.views{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:999px}
.views button{background:none;border:none;padding:6px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.views button[aria-selected="true"]{background:var(--ink);color:#fff;font-weight:700}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:220px;flex:0 1 360px}
.progress .pt{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px;font-weight:500}
.pbar{flex:1;height:10px;background:var(--panel2);border-radius:999px;position:relative;overflow:hidden;border:1px solid var(--line)}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--green);display:block;border-radius:999px;transition:width .4s ease}

/* ===== buttons/fields ===== */
.fld{background:var(--row);border:1.5px solid var(--line);border-radius:8px;padding:7px 11px;width:100%}
.fld:focus{border-color:var(--green)}
select.fld{padding:6px 8px}
.btn{background:var(--row);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--panel2)}
.btn.pri,.btn.nv{background:var(--green);border-color:var(--green);color:var(--onacc);font-weight:700}
.btn.pri:hover,.btn.nv:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
.chk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--row)}
.chk input{margin:0;accent-color:var(--green);width:15px;height:15px}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--sel);color:var(--green)}.pill.todo{background:var(--dupbg);color:#B96F1E}.pill.no{background:var(--panel2);color:var(--muted)}

/* ===== main ===== */
.main{flex:1 1 auto;min-height:0;overflow:auto;background:var(--base)}
.wrap{padding:16px 18px 48px;max-width:1360px;margin:0 auto}

/* product nav */
.pnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pnav .find{position:relative;flex:1 1 260px;max-width:460px}
.pnav .pos{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-weight:500}

/* ===== tree (simple) ===== */
.tree{position:relative}
.root{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px}
.root .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.root h2{margin:4px 0 0;font-size:22px;font-weight:800}
.root .rm{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:4px}
.stub{display:none}
.branches{display:flex;align-items:flex-start;gap:12px}
.col{flex:1 1 0;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.col.im{flex:1.7 1 0}
.col.raw{flex:1.15 1 0}
.colh{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.colh .cn{font-weight:800;font-size:15px}
.colh .cc{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--muted)}
.lane{display:flex;flex-direction:column;gap:6px}
.node{background:var(--row);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.node.pop{animation:pop .25s ease-out}
.node .nn{display:flex;align-items:center;gap:6px}
.node .name{font-weight:700;font-size:15px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .nq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.node .nq .qu{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap}
.node .nq .fi{flex:1 1 90px;min-width:90px;max-width:180px}
.node .nq input{border:1.5px solid var(--line);border-radius:8px;background:var(--row);padding:3px 7px;min-width:0}
.node .nq input:focus{border-color:var(--green)}
.node .nq .qi{width:62px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.node .nq .ui{width:70px;padding:3px 4px}
.node .nq select{border:1.5px solid var(--line);border-radius:8px;background:var(--row)}

.node .nq .ul{color:var(--muted);font-size:11px}
.ico{border:none;background:none;color:var(--muted);padding:2px 6px;line-height:1;border-radius:999px;font-size:13px}
.ico:hover{color:var(--red);background:#FDECEC}
.addn{border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);background:transparent;padding:8px 12px;text-align:left;width:100%;font-weight:600}
.addn:hover{background:var(--panel2);color:var(--ink);border-color:var(--ink)}
.node.im{background:var(--panel2)}
.node.im .sub{margin-top:8px}
.node.im .sub .branches{flex-direction:column;gap:8px}
.node.im .sub .col{background:var(--row);padding:8px;border-radius:10px;flex:none;width:100%}
.node.im .sub .colh{border-bottom-width:1.5px;padding-bottom:6px;margin-bottom:6px}
.node.im .sub .colh .cn{font-size:13px}
.node.deep{padding:6px 10px}
.node.deep .name{font-size:14px}
.sublbl{font-size:11px;color:var(--muted);font-weight:700;margin-top:8px}

/* entry form */
.entry{background:var(--row);border:1.5px solid var(--ink);border-radius:10px;padding:10px;position:relative}
.entry .er{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.entry .fld{width:auto;flex:1 1 120px;min-width:0}
.entry .fld.sm{flex:0 0 74px}
.entry .equ{display:inline-flex;gap:4px;flex-wrap:nowrap;align-items:center}
.entry .equ .fld.sm{flex:0 0 auto;width:74px}
.entry select.fld.sm,.entry .equ select.fld.sm{flex:0 0 auto;width:96px;padding:6px 6px}
.entry .fld.md{flex:0 0 92px}
.entry .eb{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.entry .hint{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.sug{position:absolute;left:10px;right:10px;top:100%;margin-top:4px;background:var(--row);border:1.5px solid var(--line);border-radius:10px;z-index:20;max-height:min(60vh,520px);overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.sug button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--hair);padding:8px 12px}
.sug button:last-child{border-bottom:none}
.sug button.on,.sug button:hover{background:var(--sel)}
.sug .sc{font-size:10px;color:var(--muted);letter-spacing:.04em;min-width:64px;padding-top:3px}
.sug .sn{flex:1;font-weight:500}
.sug .ss{color:var(--muted);font-size:11px}
.sug .new{color:var(--green);font-weight:700}

/* same-name group */
.same{margin:14px 0 0;border-radius:10px;background:var(--dupbg);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}

/* expansion */
.exp{margin-top:20px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.exp h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--hair);font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exp .qtyin{width:80px;text-align:right;padding:4px 8px;background:var(--row);border:1.5px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums;font-weight:700}
.exp .note{padding:9px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--hair)}
.alert{margin-top:12px;padding:10px 14px;border-radius:10px;color:#B23B3B;background:#FDECEC}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--row);table-layout:fixed}
table.wexp{min-width:700px}
table.wbuy{min-width:1000px}
table.wim{min-width:700px}
table.wpr{min-width:980px}
thead th{position:sticky;top:0;z-index:5;background:var(--panel2);text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);padding:8px 10px;white-space:nowrap}
tbody td{border-bottom:1px solid var(--hair);padding:6px 10px;vertical-align:middle}
tbody tr:hover{background:#FAFAF8}
tbody tr.dup{background:var(--dupbg)}
td.c{text-align:center}
td.r{text-align:right}
td input{width:100%;background:transparent;border:1.5px solid transparent;border-radius:8px;padding:4px 7px;min-width:0}
td input:focus{background:var(--row);border-color:var(--green)}
td.mono input{font-variant-numeric:tabular-nums}
td.rr input{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty div+div{margin-top:6px;font-size:12px}

/* ===== map ===== */
.mapbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:4px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px}
.tile{background:var(--row);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;min-height:60px}
.tile:hover{background:var(--panel2)}
.tile.s1{border-color:var(--amber)}
.tile.s2{border-color:var(--green);background:var(--sel)}
.tile.cur{outline:3px solid rgba(34,34,34,.25)}
.tile .tc{font-size:10px;color:var(--muted);letter-spacing:.04em;display:flex;gap:6px}
.tile .tn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:11px;color:var(--muted)}

/* ===== masters ===== */
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;background:var(--panel2);padding:4px;border-radius:999px;width:max-content;max-width:100%}
.tabs button{background:none;border:none;border-radius:999px;padding:6px 14px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;font-weight:700}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .grow{flex:1 1 200px;min-width:0;max-width:440px}
.bar select.fld{width:auto;flex:0 0 auto}
.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px}
.quick .fld{width:auto;flex:0 1 auto}
.quick .fld.name{flex:1 1 220px;max-width:420px}
.quick .fld.short{width:100px}
.quick .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.more{display:block;width:100%;margin-top:10px;padding:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;color:var(--muted)}

/* ===== modal / toast ===== */
.ov{position:fixed;inset:0;background:rgba(40,40,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;z-index:60;overflow:auto}
.modal{background:var(--base);border-radius:14px;width:100%;max-width:760px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.modal header h2{margin:0;font-size:15px;font-weight:800;flex:1}
.modal .body{padding:18px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:10px;background:var(--panel);padding:20px;text-align:center;color:var(--muted)}
.drop.hot{border-color:var(--green);background:var(--sel);color:var(--ink)}
textarea.paste{width:100%;height:110px;background:var(--row);border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:12px;resize:vertical}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:4px}
.maps label{display:block}.maps span{display:block;margin-bottom:2px;font-size:12px}
.sum{margin-top:12px;padding:10px 12px;background:var(--panel);border-radius:10px}
.sum b{font-variant-numeric:tabular-nums}
.errs{margin-top:8px;max-height:130px;overflow:auto;font-size:11px;color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-size:12px;max-width:90vw}

@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.tree.anim{animation:slidein .18s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){
  .entry .er .fld:first-child{flex:1 1 100%}
  .branches{flex-direction:column;gap:10px;align-items:stretch}
  .col{width:100%}
  .wrap{padding:12px 12px 40px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top-in">
      <div class="brand">
        <h1>商品BOM構成</h1>
        <span class="tools">
          <span class="mode">自動保存（このブラウザ）</span>
          <button class="btn sm" type="button" id="btnSave">作業ファイルを保存</button>
          <button class="btn sm" type="button" id="btnOpen">開く</button>
          <input type="file" id="openFile" accept=".json" class="hide">
        </span>
      </div>
      <div class="navrow">
        <div class="views" role="tablist" id="views"></div>
        <div class="progress"><span class="pt" id="ptext"></span><div class="pbar"><i id="pbar" style="width:0"></i></div></div>
      </div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>
<div id="layer"></div>

<script>
"use strict";
(function(){
var DIV=["原料","加工食材","資材","中間品","商品"];
var PREFIX={"原料":"RM","加工食材":"PM","資材":"PK","中間品":"IM","商品":"BP"};
var PAD={"原料":4,"加工食材":4,"資材":4,"中間品":4,"商品":6};
var BUY={"原料":1,"加工食材":1,"資材":1,"中間品":0,"商品":0};
var CC={"商品":"var(--c-pr)","原料":"var(--c-raw)","中間品":"var(--c-im)","加工食材":"var(--c-pm)","資材":"var(--c-pk)"};
var TT={"商品":"var(--t-pr)","原料":"var(--t-raw)","中間品":"var(--t-im)","加工食材":"var(--t-pm)","資材":"var(--t-pk)"};
var BR={"商品":["原料","中間品","加工食材","資材"],"中間品":["加工食材","資材"]};
var ICON={"商品":"🥗","原料":"🥬","中間品":"🥡","加工食材":"🧀","資材":"📦"};
var UNITS={"原料":["g","kg","個","玉","束","本","袋","枚","ml","L"],"加工食材":["g","kg","ml","L","個","枚","本","袋","パック"],"資材":["個","枚","本","m","cm","cm²","m²","袋","ケース","巻"],"中間品":["個","パック","袋","g","kg","ml"],"商品":["個","パック","袋","ケース","g","kg"]};
function unitList(div){var base=(UNITS[div]||UNITS["資材"]).slice();(S.units[div]||[]).forEach(function(u){if(base.indexOf(u)<0)base.push(u);});return base;}
function registerUnit(div,u){u=String(u||"").trim();if(!u)return;if((UNITS[div]||[]).indexOf(u)>=0)return;if(!S.units[div])S.units[div]=[];if(S.units[div].indexOf(u)<0){S.units[div].push(u);lsSave();}}
function unitSelect(div,cur,cls,id){
  var sel=el("select",cls);if(id)sel.id=id;
  var list=unitList(div);if(cur&&list.indexOf(cur)<0)list.unshift(cur);
  var o0=el("option",null,"単位");o0.value="";if(!cur)o0.selected=true;sel.appendChild(o0);
  list.forEach(function(u){var o=el("option",null,u);o.value=u;if(u===cur)o.selected=true;sel.appendChild(o);});
  var on=el("option",null,"その他（記入）…");on.value="__new__";sel.appendChild(on);
  var prev=cur||"";
  sel.addEventListener("change",function(e){
    if(sel.value!=="__new__"){prev=sel.value;return;}
    e.stopImmediatePropagation();
    var inp=el("input","fld ui-new");inp.placeholder="単位を記入";inp.style.width="90px";
    sel.classList.add("hide");sel.insertAdjacentElement("afterend",inp);inp.focus();
    var done=false;
    function finish(ok){
      if(done)return;done=true;
      var v=inp.value.trim();inp.remove();sel.classList.remove("hide");
      if(ok&&v){
        registerUnit(div,v);
        var has=false;for(var i=0;i<sel.options.length;i++)if(sel.options[i].value===v)has=true;
        if(!has){var o=el("option",null,v);o.value=v;sel.insertBefore(o,on);}
        sel.value=v;prev=v;sel.dispatchEvent(new Event("change"));
      }else{sel.value=prev;}
      sel.focus();
    }
    inp.onkeydown=function(ev){if(ime(ev))return;if(ev.key==="Enter"){ev.preventDefault();ev.stopPropagation();finish(true);}if(ev.key==="Escape"){ev.preventDefault();ev.stopPropagation();finish(false);}};
    inp.onblur=function(){setTimeout(function(){finish(true);},0);};
  });
  return sel;
}
function splitQty(v){var m=String(v||"").trim().match(/^([0-9０-９.．,]+)\s*([^0-9０-９.．,\s].*)?$/);if(!m)return {q:String(v||"").trim(),u:""};var q=m[1].replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/．/g,".").replace(/,/g,"");return {q:q,u:(m[2]||"").trim()};}
var MAXDEPTH=12;

var S={view:"tree",cur:null,items:new Map(),bom:new Map(),open:null,qty:100,
       mtab:"原料",q:"",dupOnly:false,todoOnly:false,limit:200,mapF:"all",
       focusId:null,anim:false,unitMem:{},units:{}};

/* ===== utils ===== */
function ime(e){return !!(e&&(e.isComposing||e.keyCode===229));}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function norm(s){
  if(!s)return "";
  s=String(s).replace(/[Ａ-Ｚａ-ｚ０-９]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);});
  s=s.replace(/[ァ-ヶ]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0x60);});
  return s.toLowerCase().replace(/[\s　\-ー－_,.、。()（）\/]/g,"");
}

function migrate(r){
  if(r.div==="完成品")r.div="商品";

  if(DIV.indexOf(r.div)<0)r.div="原料";

}
function lsSave(){

}

/* ===== derived ===== */
function byCode(){var m=new Map();S.items.forEach(function(r){if(r.code)m.set(String(r.code).trim(),r);});return m;}
function childrenOf(pid){var out=[];S.bom.forEach(function(l){if(l.p===pid)out.push(l);});out.sort(function(a,b){return (a.seq||0)-(b.seq||0);});return out;}
function bomCount(pid){var n=0;S.bom.forEach(function(l){if(l.p===pid)n++;});return n;}
function nextCode(div){
  var p=PREFIX[div],w=PAD[div],max=0;
  S.items.forEach(function(r){var c=String(r.code||"");if(c.indexOf(p+"-")===0){var n=parseInt(c.slice(p.length+1),10);if(n>max)max=n;}});
  return function(){max++;return p+"-"+String(max).padStart(w,"0");};
}
function findByName(div,name){
  var n=norm(name);if(!n)return null;var hit=null;
  S.items.forEach(function(r){if(hit||r.div!==div)return;if(norm(r.name)===n||(r.code&&norm(r.code)===n))hit=r;});
  return hit;
}
function newItem(div,name,spec,unit){
  var r={id:uid("i"),code:nextCode(div)(),name:name||"",kana:"",jan:"",div:div,spec:spec||"",unit:unit||"",punit:"",conv:"",supplier:"",note:"",ok:false,done:false};
  S.items.set(r.id,r);return r;
}
function countDiv(d){var n=0;S.items.forEach(function(r){if(r.div===d)n++;});return n;}
function products(){
  var out=[];S.items.forEach(function(r){if(r.div==="商品")out.push(r);});
  out.sort(function(a,b){var ac=String(a.code||"~~~"),bc=String(b.code||"~~~");if(ac!==bc)return ac<bc?-1:1;return String(a.name||"").localeCompare(String(b.name||""));});
  return out;
}
function status(p){if(p.done)return 2;return bomCount(p.id)?1:0;}
function statusName(s){return ["未着手","途中","完了"][s];}
function sameGroup(p){
  var n=norm(p.name),j=String(p.jan||"").replace(/\D/g,""),out=[];
  if(!n&&!j)return out;
  S.items.forEach(function(r){if(r.div!=="商品"||r.id===p.id)return;if((n&&norm(r.name)===n)||(j&&String(r.jan||"").replace(/\D/g,"")===j))out.push(r);});
  return out;
}
function dupKeys(){
  var byName=new Map(),byJan=new Map(),dup=new Set();
  S.items.forEach(function(r){
    if(r.div!=="商品")return;
    var n=norm(r.name);if(n){if(!byName.has(n))byName.set(n,[]);byName.get(n).push(r.id);}
    var j=String(r.jan||"").replace(/\D/g,"");if(j){if(!byJan.has(j))byJan.set(j,[]);byJan.get(j).push(r.id);}
  });
  [byName,byJan].forEach(function(m){m.forEach(function(ids){if(ids.length>1)ids.forEach(function(i){dup.add(i);});});});
  return dup;
}

/* ===== expansion ===== */
function expand(rootId,qty){
  var need=new Map(),inter=new Map(),errs=[];
  function acc(m,ch,q,u){var k=ch.id+"|"+u,e=m.get(k);if(e)e.qty+=q;else m.set(k,{item:ch,qty:q,unit:u});}
  function walk(pid,mult,path,depth){
    if(depth>MAXDEPTH){errs.push("階層が深すぎます（"+MAXDEPTH+"段で打ち切り）");return;}
    childrenOf(pid).forEach(function(l){
      var ch=S.items.get(l.c);if(!ch)return;
      var q=mult*nn(l.qty)*(nn(l.loss)||1),u=(l.unit||ch.unit||"").trim();
      if(path.indexOf(ch.id)>=0){errs.push("循環参照: "+(ch.name||ch.code));return;}
      if(ch.div==="中間品"){acc(inter,ch,q,u);walk(ch.id,q,path.concat([ch.id]),depth+1);}else acc(need,ch,q,u);
    });
  }
  walk(rootId,qty,[rootId],1);
  var sf=function(a,b){var d=DIV.indexOf(a.item.div)-DIV.indexOf(b.item.div);if(d)return d;return String(a.item.code||"").localeCompare(String(b.item.code||""));};
  return {need:Array.from(need.values()).sort(sf),inter:Array.from(inter.values()).sort(sf),errs:errs};
}

function grabFocus(){var a=document.activeElement;if(!a||!a.dataset||!a.dataset.f)return null;return {id:a.dataset.rid,f:a.dataset.f,s:a.selectionStart,e:a.selectionEnd};}

  n.focus();try{if(f.s!=null&&n.setSelectionRange)n.setSelectionRange(f.s,f.e);}catch(e){}

  var add=el("button","btn nv sm","引き当て  ⏎");add.type="button";
  var close=el("button","btn sm","閉じる");close.type="button";close.onclick=function(){S.open=null;render();};
  eb.appendChild(add);eb.appendChild(close);
  eb.appendChild(el("span","hint","名前を空にしてEnterで閉じる"));
  f.appendChild(eb);

  var picked=null,sugI=-1,sugItems=[];
  function cands(){
    var q=norm(name.value);var out=[];
    S.items.forEach(function(r){if(r.div!==d||r.id===parent.id)return;if(!q||norm([r.code,r.name,r.spec].join(" ")).indexOf(q)>=0)out.push(r);});
    out.sort(function(a,b){var an=norm(a.name).indexOf(q)===0?0:1,bn=norm(b.name).indexOf(q)===0?0:1;if(an!==bn)return an-bn;return String(a.name||"").localeCompare(String(b.name||""));});
    return out;
  }
  function drawSug(){
    sug.textContent="";sugItems=cands();
    var q=name.value.trim();
    if(!q&&!sugItems.length){sug.classList.add("hide");return;}
    sugItems.forEach(function(r,i){
      var b=el("button");b.type="button";if(i===sugI)b.classList.add("on");
      b.appendChild(el("span","sc",r.code||"—"));b.appendChild(el("span","sn",r.name||"（名称未設定）"));b.appendChild(el("span","ss",[r.spec,r.unit].filter(Boolean).join(" ")));
      b.onmousedown=function(ev){ev.preventDefault();pick(r);};sug.appendChild(b);
    });
    var exact=q?findByName(d,q):null;
    if(q&&!exact){
      var nb=el("button");nb.type="button";if(sugI===sugItems.length)nb.classList.add("on");
      nb.appendChild(el("span","sc","新規"));nb.appendChild(el("span","sn new","「"+q+"」を"+d+"マスタに登録して引き当てる"));
      nb.onmousedown=function(ev){ev.preventDefault();picked=null;submit();};sug.appendChild(nb);
    }
    sug.classList.toggle("hide",!sug.childElementCount);
    var on=sug.querySelector("button.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest"});
  }
  function pick(r){picked=r;name.value=r.name||"";sug.classList.add("hide");if(r.unit&&!unit.value){var has=false;for(var i=0;i<unit.options.length;i++)if(unit.options[i].value===r.unit)has=true;if(!has){var o=el("option",null,r.unit);o.value=r.unit;unit.appendChild(o);}unit.value=r.unit;}(form||qty).focus();}
  function submit(){
    var n=name.value.trim();
    if(!n){S.open=null;render();return;}
    var sp=splitQty(qty.value);var uu=sp.u||unit.value.trim();if(uu&&uu!=="__new__")registerUnit(d,uu);else if(uu==="__new__")uu="";
    var it=(picked&&norm(picked.name)===norm(n))?picked:(findByName(d,n)||newItem(d,n,"",uu));
    var l={id:uid("b"),p:parent.id,c:it.id,qty:sp.q,unit:uu||it.unit||"",form:form?form.value.trim():"",loss:"1",note:"",seq:childrenOf(parent.id).length+1};
    S.unitMem[d]=uu;
    var isNewIm=it.div==="中間品"&&bomCount(it.id)===0;
    if(isNewIm)S.open={p:it.id,d:"加工食材"};else S.open={p:parent.id,d:d};
    S.focusId="ename";S.lastLine=l.id;
    commit("bom",[l]);
    toast(isNewIm?(it.name+" の中身を入れてください"):(d+"　"+it.name+" を引き当て"));
  }
  name.oninput=function(){picked=null;sugI=-1;drawSug();};
  name.onfocus=function(){drawSug();};
  name.onblur=function(){setTimeout(function(){sug.classList.add("hide");},150);};
  name.onkeydown=function(ev){if(ime(ev))return;
    var total=sug.childElementCount;
    if(ev.key==="ArrowDown"){ev.preventDefault();if(sug.classList.contains("hide"))drawSug();sugI=Math.min(total-1,sugI+1);drawSug();return;}
    if(ev.key==="ArrowUp"){ev.preventDefault();sugI=Math.max(-1,sugI-1);drawSug();return;}
    if(ev.key==="Escape"){if(!sug.classList.contains("hide")){sug.classList.add("hide");return;}S.open=null;render();return;}
    if(ev.key==="Enter"){
      ev.preventDefault();
      if(sugI>=0&&sugI<sugItems.length){pick(sugItems[sugI]);return;}
      if(!name.value.trim()){submit();return;}
      var ex=findByName(d,name.value);
      if(ex){pick(ex);return;}
      submit();
    }
  };
  [qty,unit].concat(form?[form]:[]).forEach(function(i){i.onkeydown=function(ev){if(ime(ev))return;if(ev.key==="Enter"){ev.preventDefault();submit();}if(ev.key==="Escape"){S.open=null;render();}};});
  add.onclick=submit;
  return f;
}

function fieldSet(mode){return mode==="bom"?"bom":(mode==="商品"?"pr":(mode==="中間品"?"im":(mode==="原料"?"raw":"buy")));}
var IMP={};
var SAMPLE={
  "商品":{head:["社内商品コード","商品名","読み","JAN","販売単位","備考"],rows:[["BP-000001","シーザーサラダ 200g","しーざーさらだ","4512345000012","パック",""],["（空欄なら自動採番）","コールスロー 150g","","4512345000029","パック",""]]},
  "原料":{head:["コード","名称","規格","基本単位","仕入単位","仕入換算","仕入先","備考"],rows:[["RM-0001","レタス","L","kg","ケース","10","青果卸A",""],["（空欄なら自動採番）","キャベツ","","kg","ケース","20","青果卸A",""]]},
  "加工食材":{head:["コード","名称","基本単位","仕入単位","仕入換算","仕入先","備考"],rows:[["PM-0001","ドレッシング液","g","本","500","食材商社B",""],["（空欄なら自動採番）","ベーコン","g","袋","500","食材商社B",""]]},
  "資材":{head:["コード","名称","基本単位","仕入単位","仕入換算","仕入先","備考"],rows:[["PK-0001","サラダカップ 350ml","個","箱","1000","資材商事C",""],["（空欄なら自動採番）","フィルム","m","巻","2000","資材商事C",""]]},
  "中間品":{head:["コード","名称","基本単位","備考"],rows:[["IM-0001","ドレッシングパック","個",""],["（空欄なら自動採番）","カット野菜ミックス","g",""]]}
};
function sampleBlock(mode){
  var sp=SAMPLE[mode];if(!sp)return el("div");
  var smp=el("div");smp.style.textAlign="left";
  smp.appendChild(el("div","lbl","取り込めるCSVの例"));
  var st=el("table");st.style.marginTop="6px";st.style.border="1.5px solid var(--line)";st.style.borderRadius="10px";st.style.fontSize="12px";st.style.tableLayout="auto";st.style.whiteSpace="nowrap";
  var sh=el("thead"),shr=el("tr");sp.head.forEach(function(h){shr.appendChild(el("th",null,h));});sh.appendChild(shr);st.appendChild(sh);
  var sb=el("tbody");
  sp.rows.forEach(function(r){var tr=el("tr");r.forEach(function(v,i){var td=el("td",null,v);if(i===0&&v.indexOf("（")===0)td.style.color="var(--muted)";tr.appendChild(td);});sb.appendChild(tr);});
  st.appendChild(sb);var stw=el("div","tablewrap");stw.appendChild(st);smp.appendChild(stw);
  var tb=el("button","btn sm","CSVフォーマットをダウンロード");tb.type="button";tb.style.marginTop="8px";
  tb.onclick=function(){dl(mode+"マスタ_フォーマット.csv",toCsv(sp.head,[sp.rows[0]]));};
  smp.appendChild(tb);
  return smp;
}
function openImport(mode){
  IMP={mode:mode,headers:[],rows:[],map:{},hasHeader:true,over:true};
  var ov=el("div","ov");ov.id="ov";var m=el("div","modal");
  var hd=el("header");hd.appendChild(el("h2",null,mode==="bom"?"構成を取込む":mode+"マスタを取込む"));
  var x=el("button","btn","閉じる");x.onclick=closeModal;hd.appendChild(x);m.appendChild(hd);
  var body=el("div","body");body.id="impbody";m.appendChild(body);
  var ft=el("footer");var info=el("div");info.id="impinfo";info.style.marginRight="auto";info.style.color="var(--muted)";ft.appendChild(info);
  var cancel=el("button","btn","キャンセル");cancel.onclick=closeModal;
  var go=el("button","btn pri","取込む");go.id="impgo";go.disabled=true;go.onclick=doImport;
  ft.appendChild(cancel);ft.appendChild(go);m.appendChild(ft);ov.appendChild(m);
  ov.onclick=function(e){if(e.target===ov)closeModal();};document.getElementById("layer").appendChild(ov);
  drawImportBody();
}
function closeModal(){var ov=document.getElementById("ov");if(ov)ov.remove();}
function drawImportBody(){
  var b=document.getElementById("impbody");if(!b)return;b.textContent="";
  var drop=el("div","drop");drop.appendChild(el("div",null,"Excel（.xlsx）／CSV をここにドロップ"));
  var pick=el("button","btn","ファイルを選ぶ");pick.style.marginTop="8px";
  var fi=el("input");fi.type="file";fi.accept=".xlsx,.xls,.csv,.txt";fi.className="hide";fi.onchange=function(){if(fi.files[0])readFile(fi.files[0]);};
  pick.onclick=function(){fi.click();};drop.appendChild(pick);drop.appendChild(fi);
  drop.ondragover=function(e){e.preventDefault();drop.classList.add("hot");};drop.ondragleave=function(){drop.classList.remove("hot");};
  drop.ondrop=function(e){e.preventDefault();drop.classList.remove("hot");if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);};
  b.appendChild(drop);
  var or=el("div",null,"または Excel からコピーして貼り付け");or.style.margin="12px 0 4px";b.appendChild(or);
  var ta=el("textarea","paste");ta.placeholder="1行目に見出し、2行目以降にデータ";ta.onpaste=function(){setTimeout(function(){parseText(ta.value);},10);};ta.onchange=function(){parseText(ta.value);};b.appendChild(ta);
  if(!IMP.rows.length){if(IMP.mode!=="bom"){var sbk=sampleBlock(IMP.mode);sbk.style.marginTop="16px";b.appendChild(sbk);}return;}
  var opt=el("div");opt.style.margin="14px 0 6px";opt.style.display="flex";opt.style.gap="8px";opt.style.flexWrap="wrap";
  opt.appendChild(chk("hasHeader","1行目は見出し",IMP.hasHeader,function(v){IMP.hasHeader=v;reguess();}));
  opt.appendChild(chk("over","同じコードは上書き",IMP.over,function(v){IMP.over=v;summarize();}));b.appendChild(opt);
  b.appendChild(el("div","lbl","列の対応"));
  var maps=el("div","maps");
  FIELDS[fieldSet(IMP.mode)].forEach(function(f){
    var lab=el("label");lab.appendChild(el("span",null,f[1]));var s=el("select","fld");
    var o0=el("option",null,"— 取込まない —");o0.value="";s.appendChild(o0);
    IMP.headers.forEach(function(h,i){var o=el("option",null,h||("列"+(i+1)));o.value=String(i);if(IMP.map[f[0]]===i)o.selected=true;s.appendChild(o);});
    s.onchange=function(){IMP.map[f[0]]=s.value===""?null:parseInt(s.value,10);summarize();};lab.appendChild(s);maps.appendChild(lab);
  });
  b.appendChild(maps);var sum=el("div","sum");sum.id="impsum";b.appendChild(sum);var errs=el("div","errs");errs.id="imperrs";b.appendChild(errs);summarize();
}
function readFile(f){
  var name=(f.name||"").toLowerCase();
  if(/\.(xlsx|xls)$/.test(name)){
    if(!window.XLSX){toast("Excelを読めません。CSVで保存して取込んでください");return;}
    var fr=new FileReader();fr.onload=function(){try{var wb=XLSX.read(new Uint8Array(fr.result),{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];setRows(XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false}));}catch(e){toast("Excelを読めませんでした");}};
    fr.readAsArrayBuffer(f);
  }else{var fr2=new FileReader();fr2.onload=function(){parseText(String(fr2.result));};fr2.readAsText(f,"UTF-8");}
}
function parseText(txt){
  if(!txt||!txt.trim())return;var delim=txt.indexOf("\t")>=0?"\t":",";var rows=[],cur=[],val="",q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){val+='"';i++;}else q=false;}else val+=ch;}
    else if(ch==='"')q=true;else if(ch===delim){cur.push(val);val="";}else if(ch==="\n"){cur.push(val);rows.push(cur);cur=[];val="";}else if(ch==="\r"){}else val+=ch;}
  if(val!==""||cur.length){cur.push(val);rows.push(cur);}
  rows=rows.filter(function(r){return r.some(function(c){return String(c).trim()!=="";});});setRows(rows);
}
function setRows(aoa){if(!aoa||!aoa.length){toast("データが読み取れません");return;}IMP.rows=aoa;reguess();}
function reguess(){
  var aoa=IMP.rows;if(!aoa.length)return;var width=0;aoa.forEach(function(r){if(r.length>width)width=r.length;});
  IMP.headers=[];for(var i=0;i<width;i++)IMP.headers.push(IMP.hasHeader?String(aoa[0][i]==null?"":aoa[0][i]).trim():"列"+(i+1));
  IMP.map={};
  FIELDS[fieldSet(IMP.mode)].forEach(function(f){var key=f[0],al=ALIAS[key]||[];
    for(var i=0;i<IMP.headers.length;i++){var h=norm(IMP.headers[i]);if(!h)continue;for(var k=0;k<al.length;k++){if(h.indexOf(norm(al[k]))>=0){IMP.map[key]=i;return;}}}});
  drawImportBody();
}
function impRows(){return IMP.hasHeader?IMP.rows.slice(1):IMP.rows.slice(0);}
function pick(row,field){var i=IMP.map[field];if(i==null)return "";return String(row[i]==null?"":row[i]).trim();}
function summarize(){
  var sum=document.getElementById("impsum"),errBox=document.getElementById("imperrs");if(!sum)return;
  var rows=impRows(),codes=byCode(),add=0,upd=0,skip=0,errs=[];
  if(IMP.mode==="bom"){
    rows.forEach(function(r,idx){var pc=pick(r,"pcode"),cc=pick(r,"ccode");if(!pc&&!cc){skip++;return;}
      var P=codes.get(pc),C=codes.get(cc);
      if(!P){errs.push((idx+1)+"行目: 親コード "+(pc||"空欄")+" がありません");return;}
      if(!BR[P.div]){errs.push((idx+1)+"行目: "+pc+" は"+P.div+"のため親になれません");return;}
      if(!C){errs.push((idx+1)+"行目: 構成コード "+(cc||"空欄")+" がありません");return;}
      if(BR[P.div].indexOf(C.div)<0){errs.push((idx+1)+"行目: "+P.div+"の下に"+C.div+"は置けません");return;}add++;});
  }else{rows.forEach(function(r){var c=pick(r,"code"),n=pick(r,"name");if(!c&&!n){skip++;return;}if(c&&codes.has(c)){IMP.over?upd++:skip++;}else add++;});}
  sum.textContent="";var line=el("div");
  line.appendChild(el("span",null,"新規 "));line.appendChild(el("b",null,String(add)));line.appendChild(el("span",null," 件　更新 "));line.appendChild(el("b",null,String(upd)));
  line.appendChild(el("span",null," 件　スキップ "));line.appendChild(el("b",null,String(skip)));line.appendChild(el("span",null," 件"));sum.appendChild(line);
  if(errs.length){var w=el("div",null,"取込めない行 "+errs.length+" 件");w.style.color="var(--red)";w.style.marginTop="4px";sum.appendChild(w);}
  errBox.textContent="";errs.slice(0,30).forEach(function(m){errBox.appendChild(el("div",null,m));});
  var go=document.getElementById("impgo");if(go)go.disabled=(add+upd)===0;
  var info=document.getElementById("impinfo");if(info)info.textContent=rows.length+" 行を読み込みました";
}
function doImport(){
  var rows=impRows(),codes=byCode(),n=0;
  if(IMP.mode==="bom"){
    var bout=[],seqBy={};
    rows.forEach(function(r){var P=codes.get(pick(r,"pcode")),C=codes.get(pick(r,"ccode"));
      if(!P||!C||!BR[P.div]||BR[P.div].indexOf(C.div)<0)return;
      seqBy[P.id]=(seqBy[P.id]||bomCount(P.id))+1;
      bout.push({id:uid("b"),p:P.id,c:C.id,qty:pick(r,"qty"),unit:pick(r,"unit")||C.unit||"",form:pick(r,"form"),loss:pick(r,"loss")||"1",note:pick(r,"note"),seq:seqBy[P.id]});n++;});
    commit("bom",bout);
  }else{
    var d=IMP.mode,gen=nextCode(d),out=[];
    rows.forEach(function(r){var c=pick(r,"code"),name=pick(r,"name");if(!c&&!name)return;
      var ex=c?codes.get(c):null;if(ex&&!IMP.over)return;if(ex&&ex.div!==d)return;
      var row=ex?Object.assign({},ex):{id:uid("i"),div:d,ok:false,done:false};if(!c)c=gen();row.code=c;
      ["name","kana","jan","spec","unit","punit","conv","supplier","note"].forEach(function(f){var v=pick(r,f);if(v!=="")row[f]=v;else if(row[f]==null)row[f]="";});
      out.push(row);if(!ex)codes.set(c,row);n++;});
    commit("items",out);
  }
  closeModal();toast(n+" 件を取込みました");
}

/* ===== export ===== */
function csvCell(v){var s=v==null?"":String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function toCsv(head,rows){var out=[head.map(csvCell).join(",")];rows.forEach(function(r){out.push(r.map(csvCell).join(","));});return "﻿"+out.join("\r\n");}
function exportMaster(d){
  var head,rows=[],list=filtered(d);
  if(d==="商品"){head=["社内商品コード","商品名","読み","JAN","販売単位","引き当て","備考"];
    list.forEach(function(r){rows.push([r.code,r.name,r.kana,r.jan,r.unit,statusName(status(r)),r.note]);});}
  else if(d==="中間品"){head=["コード","名称","基本単位","備考"];list.forEach(function(r){rows.push([r.code,r.name,r.unit,r.note]);});}
  else if(d==="原料"){head=["コード","名称","規格","基本単位","仕入単位","仕入換算","仕入先","備考"];list.forEach(function(r){rows.push([r.code,r.name,r.spec,r.unit,r.punit,r.conv,r.supplier,r.note]);});}
  else{head=["コード","名称","基本単位","仕入単位","仕入換算","仕入先","備考"];list.forEach(function(r){rows.push([r.code,r.name,r.unit,r.punit,r.conv,r.supplier,r.note]);});}
  if(!rows.length){toast("書き出す行がありません");return;}
  dl(d+"マスタ_"+stamp()+".csv",toCsv(head,rows));toast(rows.length+" 行を書き出しました");
}
function exportBom(d){
  var head=["親コード","親名称","親区分","構成コード","構成名称","構成区分","加工形態","標準使用量","単位","ロス係数","備考"],rows=[],list=[];
  S.bom.forEach(function(l){var p=S.items.get(l.p);if(p&&(!d||p.div===d))list.push(l);});
  list.sort(function(a,b){var pa=S.items.get(a.p),pb=S.items.get(b.p);var ca=String(pa.code||""),cb=String(pb.code||"");if(ca!==cb)return ca<cb?-1:1;return (a.seq||0)-(b.seq||0);});
  list.forEach(function(l){var p=S.items.get(l.p),c=S.items.get(l.c);rows.push([p.code,p.name,p.div,c?c.code:"",c?c.name:"",c?c.div:"",l.form||"",l.qty,l.unit,l.loss,l.note]);});
  if(!rows.length){toast("書き出す行がありません");return;}
  dl("引き当て結果_"+stamp()+".csv",toCsv(head,rows));toast(rows.length+" 行を書き出しました");
}

/* ===== boot ===== */
function boot(){
  lsLoad();render();
  document.getElementById("btnSave").onclick=saveWork;
  var of=document.getElementById("openFile");
  document.getElementById("btnOpen").onclick=function(){of.value="";of.click();};
  of.onchange=function(){if(of.files[0])openWork(of.files[0]);};
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.getElementById("ov"))closeModal();});
boot();
})();
</script>
