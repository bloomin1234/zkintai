<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>有給カレンダー</title>
<style>
/* 有給カレンダー — 白基調。上部にボタン群、下に横スクロールする管理簿。Excel 版の配色（水色ヘッダ・青の計算値）を踏襲 */
:root {
  --bg: #FFFFFF; --panel: #FFFFFF; --soft: #F1F4F7; --fg: #1E2A36; --muted: #5B6B7B; --line: #B8C4CF; --line-strong: #7F8F9F;
  --head: #00B0F0; --head-fg: #FFFFFF; --deep: #0070C0; --deep-fg: #FFFFFF; --green: #70AD47; --green-deep: #375623;
  --stripe: #DDEBF7; --tab: #FFFFCC; --tab-fg: #1E2A36; --sat: #0070C0; --sun: #E60000; --we: #F1F5F9;
  --btn: #F7F9FB; --btn-fg: #1E2A36; --btn-line: #8A9AAA; --btn-hover: #E6EDF4; --focus: #0070C0;
  --red: #FF6464; --yellow: #FFFF99; --sel: #CFE3F7; --flag: #FFE2E2; --err: #FFD6D6;
  --chart-line: #00B0F0; --chart-top: #0070C0; --chart-bottom: #FF6464; --grid: #D5DDE5;
  color-scheme: light;
  --font: "Meiryo UI", Meiryo, "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.45; padding-block: 8px 32px; padding-inline: 16px; min-height: 100%; }
button, input, select { font: inherit; color: inherit; }
.hide { display: none !important; }
.note { color: var(--muted); font-size: 12px; }
.mono, .num { font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.blue { color: var(--deep); }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; }
.empty.pad { background: var(--soft); border: 1px solid var(--line); }
.print-only { display: none; }

/* ---- 上部 ---- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 0 10px; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.topbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--btn); color: var(--btn-fg); border: 1px solid var(--btn-line); border-radius: 3px; padding: 6px 14px; cursor: pointer; white-space: nowrap; min-height: 32px; }
.btn:hover { background: var(--btn-hover); }
.btn:focus-visible, .cal-cell:focus-visible, .mtab:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.btn.primary { background: var(--deep); color: var(--deep-fg); border-color: var(--deep); font-weight: 700; }
.btn.dark { background: var(--fg); color: #FFFFFF; border-color: var(--fg); }
.btn.sm { padding: 4px 10px; min-height: 28px; }
.btn:disabled { opacity: .5; cursor: default; }
.panelrow { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.box { border: 2px solid var(--deep); border-radius: 10px; padding: 14px 12px 10px; position: relative; display: flex; }
.box-green { border-color: var(--green); }
.box-label { position: absolute; top: -11px; left: 12px; background: var(--deep); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 3px; }
.box-green .box-label { background: var(--green); }
.box-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.company { font-weight: 700; font-size: 14px; margin: 4px 0 6px; }
.cond { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-bottom: 8px; }
.cond label { display: inline-flex; align-items: center; gap: 6px; }
.cond select { padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--panel); }
.kv b { font-weight: 600; color: var(--muted); margin-right: 6px; }
.calmode { font-weight: 700; display: inline-flex; gap: 10px; align-items: center; }

/* ---- 表 ---- */
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); max-width: 100%; }
table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
table.grid th, table.grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 3px 5px; white-space: nowrap; height: 26px; }
table.grid th { background: var(--head); color: var(--head-fg); font-weight: 700; text-align: center; line-height: 1.2; position: sticky; top: 0; z-index: 2; }
table.grid th.c-blue { background: var(--deep); color: #fff; }
table.grid tr.odd td { background: var(--stripe); }
table.grid td { background: var(--panel); }
table.grid .sticky1, table.grid .sticky2 { position: sticky; z-index: 3; }
table.grid th.sticky1, table.grid th.sticky2 { z-index: 4; }
table.grid .sticky1 { left: 0; min-width: 84px; }
table.grid .sticky2 { left: 84px; min-width: 110px; border-right: 2px solid var(--line-strong); }
table.grid td.c-name { text-align: left; }
.mcol { padding: 0 !important; background: var(--panel) !important; }
.mtab { display: block; width: 100%; height: 100%; min-width: 42px; padding: 6px 11px 6px 7px; border: 0; background: var(--tab); color: var(--tab-fg); font-weight: 700; cursor: pointer; clip-path: polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%); }
.mtab:hover { filter: brightness(.94); }
.mtab.cur { background: var(--green-deep); color: #fff; }
td.mval { min-width: 36px; text-align: center; }
table.cal th.dcol { min-width: 30px; padding: 3px 2px; }
table.cal tr.wdrow th { background: var(--panel); color: var(--fg); top: 27px; }
table.cal tr.wdrow th.wd0 { color: var(--sun); }
table.cal tr.wdrow th.wd6 { color: var(--sat); }
td.cal-cell { min-width: 30px; text-align: center; cursor: pointer; padding: 3px 2px; user-select: none; }
td.cal-cell.wd0, td.cal-cell.wd6 { background: var(--we) !important; }
td.cal-cell:hover { background: var(--sel) !important; }
table.grid tr.odd td.cal-cell.wd0, table.grid tr.odd td.cal-cell.wd6 { background: var(--we) !important; }

/* ---- モーダル ---- */
.modal-wrap { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow: auto; z-index: 100; }
.modal { background: var(--panel); color: var(--fg); border: 1px solid var(--line-strong); box-shadow: 0 8px 30px rgba(0, 0, 0, .3); width: 720px; max-width: 100%; }
.modal.w-sm { width: 380px; } .modal.w-md { width: 560px; } .modal.w-lg { width: 760px; } .modal.w-xl { width: 960px; } .modal.msg { width: 420px; }
.modal-title { background: var(--deep); color: #fff; padding: 6px 10px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.modal-x { background: transparent; border: 0; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; }
.modal-body { padding: 14px; }
.msg-body { display: flex; gap: 12px; align-items: flex-start; padding: 6px 4px 14px; }
.msg-icon { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--deep); color: #fff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.msg-body.warn .msg-icon { background: #E8A200; } .msg-body.error .msg-icon { background: #D33; } .msg-body.ask .msg-icon { background: var(--green); }
.msg-text { padding-top: 5px; }
.btns { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.btns.right { justify-content: flex-end; }
.btns.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.form { display: flex; flex-direction: column; gap: 10px; }
.frow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.frow > label:first-child, .frow .lbl { min-width: 110px; color: var(--muted); }
.frow input[type=text], .frow input[type=number], .frow input[type=date], .frow select { padding: 5px 7px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--panel); min-width: 0; }
.frow input[type=text] { min-width: 200px; } .frow input[type=number] { width: 90px; }
.fset { border: 1px solid var(--line); padding: 8px 12px 12px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.fset legend { color: var(--muted); padding: 0 6px; }
.radios label { display: inline-flex; gap: 4px; align-items: center; margin-right: 12px; }
.chk { display: inline-flex; gap: 4px; align-items: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tab { border: 1px solid var(--line); border-bottom: 0; background: var(--soft); padding: 6px 14px; cursor: pointer; }
.tab.cur { background: var(--panel); font-weight: 700; margin-bottom: -1px; border-bottom: 1px solid var(--panel); }
.pdref { border-collapse: collapse; font-size: 12px; margin-left: 118px; }
.pdref th, .pdref td { border: 1px solid var(--line); padding: 2px 8px; text-align: center; }
.pdref th { background: var(--soft); font-weight: 600; }
table.gtable th, table.gtable td { text-align: center; }
table.gtable input { width: 56px; text-align: center; padding: 3px; border: 1px solid var(--line); background: var(--panel); }
.kvtable { border-collapse: collapse; }
.kvtable th, .kvtable td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.kvtable th { background: var(--soft); color: var(--muted); font-weight: 600; }
.restore-info { min-height: 20px; }
.csv-errors { margin-top: 8px; font-size: 12px; max-height: 180px; overflow: auto; }
.err { color: #D33; }
input.err, select.err { background: var(--err) !important; }

/* ---- 社員情報 ---- */
.emp-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.listbox { border: 1px solid var(--line-strong); background: var(--panel); height: 420px; overflow: auto; }
.emp-right .listbox { height: auto; max-height: 420px; }
.listbox.tall { height: 300px; }
table.lst { border-collapse: collapse; width: 100%; }
table.lst th, table.lst td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; }
table.lst th { position: sticky; top: 0; background: var(--soft); color: var(--muted); font-weight: 600; }
table.lst th.num, table.lst td.num { text-align: right; }
table.lst tbody tr { cursor: pointer; }
table.lst tbody tr:hover { background: var(--stripe); }
table.lst tr.sel td { background: var(--sel); }
table.lst tr.flag td { background: var(--flag); }
table.lst.kv td:first-child { color: var(--muted); width: 45%; }
table.lst.kv tbody tr { cursor: default; }

/* ---- 入力シート ---- */
.sheetnote { color: var(--muted); margin: 4px 0 8px; }
table.input td { padding: 2px; }
table.input input, table.input select { width: 100%; min-width: 110px; padding: 4px 6px; border: 1px solid var(--line); background: var(--panel); }
table.input input[type=number] { min-width: 90px; }
table.input .rown { width: 34px; text-align: center; color: var(--muted); background: var(--soft) !important; }
table.input th { font-weight: 600; }

/* ---- レポート ---- */
.report, .ledger { background: var(--panel); border: 1px solid var(--line); padding: 20px 24px; max-width: 860px; }
.rp-head { position: relative; }
.rp-term { text-align: right; color: var(--muted); }
.report h2 { font-size: 20px; margin: 4px 0 6px; }
.rp-note { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
.rp-company { text-align: right; font-weight: 700; }
table.rpt { border-collapse: collapse; width: 100%; }
table.rpt th, table.rpt td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rpt th { border-top: 1px solid var(--fg); border-bottom: 1px solid var(--fg); font-weight: 600; text-align: center; line-height: 1.2; }
table.rpt td.num { text-align: center; }
table.rpt td.red { background: var(--red); } table.rpt td.yellow { background: var(--yellow); }
.rp-caption { text-align: right; font-size: 12px; color: var(--muted); margin: 6px 0 22px; }
.rp-title { text-align: center; font-size: 16px; margin: 0 0 10px; }
table.rp-analysis { border-collapse: collapse; margin: 0 auto 18px; }
table.rp-analysis td, table.rp-analysis th { padding: 4px 14px; }
table.rp-analysis th { color: var(--muted); font-weight: 600; }
table.rp-analysis td:first-child { min-width: 220px; }
.chart-line { margin: 4px 0 14px; }
.chart-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chart { width: 100%; height: auto; display: block; font-family: var(--font); }
.chart .ctitle { font-size: 13px; font-weight: 700; fill: var(--fg); }
.chart .tick { font-size: 11px; fill: var(--muted); }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--line-strong); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--chart-line); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--chart-line); opacity: .1; }
.chart .dot { fill: var(--chart-line); stroke: var(--panel); stroke-width: 2; }
.chart .bar.top { fill: var(--chart-top); } .chart .bar.bottom { fill: var(--chart-bottom); }

/* ---- 個人別管理簿 ---- */
.pager { display: inline-flex; gap: 6px; align-items: center; }
.pager select { padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--panel); }
.ledger { max-width: 1120px; overflow-x: auto; }
.lblock { padding: 8px 0 26px; break-after: page; }
.lblock h2 { text-align: center; font-size: 16px; margin: 0 0 4px; }
.lterm { text-align: right; font-size: 12px; margin-bottom: 6px; }
table.lhead, table.lgrid { border-collapse: collapse; font-size: 11.5px; }
table.lhead { margin: 0 auto 8px; }
table.lhead th, table.lhead td { border: 1px solid var(--fg); padding: 3px 10px; text-align: center; white-space: nowrap; }
table.lhead th { background: var(--stripe); font-weight: 600; }
table.lgrid { width: 100%; }
table.lgrid th, table.lgrid td { border: 1px solid var(--fg); padding: 2px 1px; text-align: center; white-space: nowrap; min-width: 25px; }
table.lgrid th { background: var(--stripe); font-weight: 600; }
table.lgrid th.lm { min-width: 36px; }
table.lgrid td.num { min-width: 34px; }
table.lgrid td.shade { background: var(--stripe); }
table.lgrid td.na { background: var(--soft); }
table.lgrid td.num { text-align: center; }
.offpage { display: none; }

@media (max-width: 700px) {
  .emp-layout, .chart-bars { grid-template-columns: 1fr; }
  .listbox { height: 240px; }
  .pdref { margin-left: 0; }
  .report, .ledger { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- 印刷 ---- */
@page { size: A4 landscape; margin: 8mm; }
@page rpt { size: A4 portrait; margin: 10mm; }
@media print {
  body { background: #fff; color: #000; padding: 0; font-size: 11px; }
  .no-print, #modals, .print-hide { display: none !important; }
  .print-only { display: inline; }
  .cond select { display: none; }
  .tablewrap, .report, .ledger { border: 0; overflow: visible; max-width: none; }
  table.grid { min-width: 0; }
  table.grid th, table.grid td { position: static !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .mtab { clip-path: none; background: #FFFFCC !important; color: #000 !important; }
  .report { page: rpt; }
  .offpage { display: block; }
  .lblock:last-child { break-after: auto; }
  .chart-bars { break-inside: avoid; }
}

</style>
</head>

function afterRender() {
  const app = $('#app');
  app.onclick = (ev) => {
    const b = ev.target.closest('[data-act]'); if (b) { handleAct(b.dataset.act, b); return; }
    const mt = ev.target.closest('.mtab'); if (mt) { calMonth = +mt.dataset.month; render(); return; }
    const cell = ev.target.closest('.cal-cell'); if (cell) { cycleUsage(cell); cell.focus(); return; }
    const emp = ev.target.closest('[data-empsel]'); if (emp) return;
  };
  app.onkeydown = (ev) => {
    const cell = ev.target.closest && ev.target.closest('.cal-cell'); if (!cell) return;
    const e = empById(+cell.dataset.id); const key = cell.dataset.date;
    const setv = (v) => { setUsage(e.id, key, v); cell.textContent = v === '' ? '' : String(v); refreshLeft(e.id); ev.preventDefault(); };
    if (ev.key === '1') setv(1);
    else if (ev.key === '5' || ev.key === '.') setv(0.5);
    else if (ev.key === '0' || ev.key === 'Delete' || ev.key === 'Backspace') setv('');
    else if (ev.key === 'Enter' || ev.key === ' ') { cycleUsage(cell); ev.preventDefault(); }
    else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) {
      const td = cell, tr = td.parentElement; let t = null;
      if (ev.key === 'ArrowLeft') t = td.previousElementSibling;
      if (ev.key === 'ArrowRight') t = td.nextElementSibling;
      if (ev.key === 'ArrowUp' && tr.previousElementSibling) t = tr.previousElementSibling.children[td.cellIndex];
      if (ev.key === 'ArrowDown' && tr.nextElementSibling) t = tr.nextElementSibling.children[td.cellIndex];
      if (t && t.classList.contains('cal-cell')) { t.focus(); ev.preventDefault(); }
    }
  };
  const sy = $('#selYear'), sm = $('#selMonth');
  if (sy) sy.onchange = () => { state.target.y = +sy.value; save(); render(); };
  if (sm) sm.onchange = () => { state.target.m = +sm.value; save(); render(); };

  const pg = $('#pageSel'); if (pg) pg.onchange = () => { ledgerPage = +pg.value; render(); };
}

function openSort(parent) {
  const keys = ['社員NO', '比例区分', '入社日', '本年取得月', '取得義務日数', '義務期間開始', '義務期間終了'];
  const w = openModal({ title: '社員並び替え', cls: 'w-sm', body: `<div class="form"><div class="frow"><label>項目</label><select id="sortKey"><option value=""></option>${opts(keys, '')}</select></div>
    <div class="frow radios"><label><input type="radio" name="sortDir" value="asc" checked>昇順</label><label><input type="radio" name="sortDir" value="desc">降順</label></div>
    <div class="btns right"><button type="button" class="btn primary" id="sortExe">並び替え</button></div></div>` });
  $('#sortExe', w).addEventListener('click', async () => {
    const key = $('#sortKey', w).value; if (!key) { await msgBox('並び替えのキーとなる項目を選んでください。', '並び替えキー選択', 'warn'); return; }
    const asc = $('input[name=sortDir]:checked', w).value === 'asc';
    const rows = computeAll();
    const val = (r) => {
      switch (key) {
        case '社員NO': return +r.emp.no || 0;
        case '比例区分': return r.propDiv > 0 ? r.propDiv : 5;
        case '入社日': return r.hire ? r.hire.getTime() : 0;
        case '本年取得月': return r.grantMonth || '-';
        case '取得義務日数': return r.duty ? (r.duty.remain <= 0 ? 'OK' : r.duty.remain) : '-';
        case '義務期間開始': return r.duty ? r.duty.start.getTime() : '-';
        case '義務期間終了': return r.duty ? r.duty.end.getTime() : '-';
      }
    };
    const cmp = (a, b) => { // Excel 流：数値→文字列
      const na = typeof a === 'number', nb = typeof b === 'number';
      if (na && nb) return a - b; if (na) return -1; if (nb) return 1; return String(a).localeCompare(String(b), 'ja');
    };
    rows.sort((a, b) => { const c = cmp(val(a), val(b)); return asc ? c : -c; });
    state.employees = rows.map(r => r.emp); save(); parent.refresh(); render(); w.remove();
  });

function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

function lineChart(months, vals, title) {
  const W = 760, H = 220, L = 40, R = 16, T = 30, B = 40;
  const max = niceMax(Math.max(1, ...vals)); const step = niceStep(max / 4);
  const n = vals.length; const x = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)); const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 4}" class="tick" text-anchor="end">${v % 1 ? v.toFixed(1) : v}</text>`; }
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${x(0).toFixed(1)},${y(0)} ` + pts + ` ${x(n - 1).toFixed(1)},${y(0)}`;
  let labels = ''; months.forEach((m, i) => { if (i % 2 === 0) labels += `<text x="${x(i)}" y="${H - B + 16}" class="tick" text-anchor="middle">${m.slice(0, 4)}/${+m.slice(5, 7)}</text>`; });
  const dots = vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" class="dot"><title>${months[i].slice(0, 4)}/${+months[i].slice(5, 7)}：${v}日</title></circle>`).join('');
  const last = vals[n - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(title)}"><text x="${W / 2}" y="16" class="ctitle" text-anchor="middle">${esc(title)}</text>${g}<polygon points="${area}" class="area"/><polyline points="${pts}" class="line"/>${dots}<text x="${x(n - 1) - 8}" y="${y(last) - 8}" class="tick" text-anchor="end">${last}</text>${labels}</svg>`;
}
function barChart(items, title, kind) {
  const W = 360, rowH = 22, L = 88, R = 36, T = 28, B = 8;
  const H = T + B + Math.max(1, items.length) * rowH;
  const max = niceMax(Math.max(1, ...items.map(i => i.total)));
  const x = v => L + (W - L - R) * v / max;
  let b = '';
  items.forEach((it, i) => {
    const yy = T + i * rowH + 3; const w = Math.max(0, x(it.total) - L);
    b += `<text x="${L - 6}" y="${yy + 12}" class="tick" text-anchor="end">${esc(it.name)}</text><rect x="${L}" y="${yy}" width="${w.toFixed(1)}" height="16" rx="0" class="bar ${kind}"><title>${esc(it.name)}：${it.total}日</title></rect><text x="${x(it.total) + 4}" y="${yy + 12}" class="tick">${it.total}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(title)}"><text x="${W / 2}" y="16" class="ctitle" text-anchor="middle">${esc(title)}</text><line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" class="axis"/>${b}</svg>`;
}

function buildLedger(y, m, ids) {

    const e = empById(id); if (!e) return;
    const hire = parseISO(e.joined);

    const evs = cEnd.events.filter(ev => ev.date >= head && ev.date <= end);
    const ev1 = evs[0] || null, ev2 = evs[1] || null;

      const days = []; for (let d = 1; d <= 31; d++) { const dim = daysInMonth(Y(ms), M(ms)); days.push(d <= dim ? (e.usage[iso(mkDate(Y(ms), M(ms), d))] ?? '') : null); }

      grantDate2: ev2 ? fmtJ(ev2.date) : '-', grantDays2: ev2 ? (flag(ev2) ? '0' : String(ev2.days || '-')) : '-',

// ---------- CSV 取込・出力 ----------
function csvEscape(v) { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCSV(rows) { return '﻿' + rows.map(r => r.map(csvEscape).join(',')).join('\r\n') + '\r\n'; }
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\r') { /* skip */ }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
function decodeCSV(buf) {
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); } catch (e) { }
  try { return new TextDecoder('shift_jis').decode(u8); } catch (e) { return new TextDecoder('utf-8').decode(u8); }
}
function downloadText(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csvDate(s) { const d = parseISO(s); return d ? fmtJ(d) : ''; }
function parseAnyDate(s) {
  const t = String(s ?? '').trim().replace(/[年月]/g, '/').replace(/日$/, '').replace(/\./g, '/');
  if (!t) return null;
  const m = /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/.exec(t); if (!m) return null;
  return parseISO(`${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`);
}
const CSV_EMP_HEAD = ['社員No', '氏名', '比例区分', '入社年月日', '入社時付与日数', '有給残登録日付', '登録日付有給残', '有給残の内前年繰越日数', '出勤率8割未満付与日'];
const CSV_USE_HEAD = ['社員No', '氏名', '取得日', '日数'];
function exportEmployeesCSV() {
  const rows = [CSV_EMP_HEAD];
  for (const e of state.employees) {
    rows.push([e.no, e.name, e.propDiv > 0 ? e.propDiv : '', csvDate(e.joined), e.grantAtJoin || '', csvDate(e.regDate), e.regLeft === '' ? '' : e.regLeft, e.regLastYearLeft === '' ? '' : e.regLastYearLeft, Object.keys(e.lessThan80 || {}).sort().map(csvDate).join(';')]);
  }
  downloadText(`社員情報_${stamp()}.csv`, toCSV(rows));
}
function exportUsageCSV() {
  const rows = [CSV_USE_HEAD];
  for (const e of state.employees) {
    for (const k of Object.keys(e.usage || {}).sort()) { const v = e.usage[k]; if (v === '' || v == null) continue; rows.push([e.no, e.name, csvDate(k), v]); }
  }
  downloadText(`有給取得日_${stamp()}.csv`, toCSV(rows));
}
function openCsvExport() {
  const w = openModal({ title: 'CSV出力', cls: 'w-sm', body: `<div class="form">
    <div class="frow"><button type="button" class="btn primary" id="csvExpEmp">社員情報CSV</button><span class="note">${state.employees.length}人</span></div>
    <div class="frow"><button type="button" class="btn primary" id="csvExpUse">有給取得日CSV</button><span class="note">${state.employees.reduce((a, e) => a + Object.keys(e.usage || {}).length, 0)}件</span></div>
    <div class="note">UTF-8（BOM付き）・Excelでそのまま開けます</div></div>` });
  $('#csvExpEmp', w).addEventListener('click', () => { exportEmployeesCSV(); });
  $('#csvExpUse', w).addEventListener('click', () => { exportUsageCSV(); });
}
function normHead(h) { return String(h ?? '').replace(/^﻿/, '').replace(/[\s※　]/g, '').toLowerCase(); }
const HEAD_ALIAS = {
  no: ['社員no', '社員番号', 'no', '社員ｎｏ'], name: ['氏名', '名前', '社員名'], pd: ['比例区分', '区分'], joined: ['入社年月日', '入社日'],
  grant: ['入社時付与日数', '入社時付与', '入社時付与日'], regDate: ['有給残登録日付', '登録日付', '有給残登録日'], regLeft: ['登録日付有給残', '有給残日数', '有給残'],
  regLY: ['有給残の内前年繰越日数', '有給残のうち前年繰越日数', '前年繰越日数', 'うち前年繰越'], lt80: ['出勤率8割未満付与日', '出勤率8割未満', '8割未満付与日'],
  date: ['取得日', '日付', '有給取得日'], val: ['日数', '取得日数', '値'],
};
function mapHeader(hdr) {
  const idx = {}; hdr.forEach((h, i) => { const n = normHead(h); for (const k in HEAD_ALIAS) if (idx[k] == null && HEAD_ALIAS[k].includes(n)) idx[k] = i; });
  return idx;
}
function analyzeCSV(text) {
  const rows = parseCSV(text); if (rows.length < 1) return { error: 'データがありません。' };
  const idx = mapHeader(rows[0]); const body = rows.slice(1);
  const get = (r, k) => idx[k] == null ? '' : String(r[idx[k]] ?? '').trim();
  const res = { errors: [], items: [] };
  if (idx.date != null && idx.no != null) {
    res.kind = 'usage';
    body.forEach((r, i) => {
      const line = i + 2, no = pad8(get(r, 'no')), d = parseAnyDate(get(r, 'date')), vs = get(r, 'val').replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      if (!no) { res.errors.push(`${line}行目：社員Noがありません`); return; }
      const emp = state.employees.find(e => pad8(e.no) === no);
      if (!emp) { res.errors.push(`${line}行目：社員No ${no} は未登録です`); return; }
      if (!d) { res.errors.push(`${line}行目：取得日が日付ではありません（${get(r, 'date')}）`); return; }
      let v = vs === '' ? 0 : Number(vs);
      if (!(v === 0 || v === 1 || v === 0.5)) { res.errors.push(`${line}行目：日数は 1／0.5／0 で入力してください（${vs}）`); return; }
      res.items.push({ emp, key: iso(d), v });
    });
    res.add = res.items.filter(x => x.v && x.emp.usage[x.key] == null).length;
    res.upd = res.items.filter(x => x.v && x.emp.usage[x.key] != null).length;
    res.del = res.items.filter(x => !x.v && x.emp.usage[x.key] != null).length;
    return res;
  }
  if (idx.no != null && idx.name != null && idx.joined != null) {
    res.kind = 'employees';
    const seen = new Set();
    body.forEach((r, i) => {
      const line = i + 2, noRaw = get(r, 'no').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)), name = get(r, 'name');
      if (!/^\d{1,8}$/.test(noRaw)) { res.errors.push(`${line}行目：社員Noは8桁以内の数値で入力してください（${noRaw}）`); return; }
      const no = pad8(noRaw);
      if (seen.has(no)) { res.errors.push(`${line}行目：社員No ${no} がCSV内で重複しています`); return; } seen.add(no);
      if (!name) { res.errors.push(`${line}行目：氏名がありません`); return; }
      const jd = parseAnyDate(get(r, 'joined'));
      if (!jd || jd < mkDate(1910, 1, 1) || jd > mkDate(9999, 6, 1)) { res.errors.push(`${line}行目：入社年月日が日付ではありません（${get(r, 'joined')}）`); return; }
      const pdS = get(r, 'pd').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      const pd = (pdS === '' || pdS === '一般' || pdS === '0') ? 0 : Number(pdS);
      if (![0, 1, 2, 3, 4].includes(pd)) { res.errors.push(`${line}行目：比例区分は空欄（一般）または1～4で入力してください（${pdS}）`); return; }
      const grantS = get(r, 'grant'); const grant = grantS === '' ? 0 : Math.floor(Number(grantS));
      if (isNaN(grant) || grant < 0 || grant > 40) { res.errors.push(`${line}行目：入社時付与日数が不正です（${grantS}）`); return; }
      const regDateS = get(r, 'regDate'), regLeftS = get(r, 'regLeft'), regLYS = get(r, 'regLY');
      let regDate = '', regLeft = '', regLY = '';
      if (regDateS || regLeftS || regLYS) {
        const rd = parseAnyDate(regDateS);
        if (!rd) { res.errors.push(`${line}行目：有給残登録日付が日付ではありません（${regDateS}）`); return; }
        if (regLeftS === '' || isNaN(Number(regLeftS))) { res.errors.push(`${line}行目：登録日付有給残を入力してください`); return; }
        regDate = iso(rd); regLeft = Number(regLeftS); regLY = regLYS === '' ? 0 : Number(regLYS);
        if (isNaN(regLY) || regLY < 0 || regLY > 20) { res.errors.push(`${line}行目：前年繰越日数が不正です（${regLYS}）`); return; }
        if (regLeft > 40) { res.errors.push(`${line}行目：有給残は最大40です（${regLeftS}）`); return; }
        if (regLY > regLeft) { res.errors.push(`${line}行目：前年繰越日数は有給残以下にしてください`); return; }
      }
      const lt80 = {}; const badLt = [];
      get(r, 'lt80').split(/[;；、,\/ ]+(?=\d{4})|[;；]/).map(s => s.trim()).filter(Boolean).forEach(s => { const d = parseAnyDate(s); if (d) lt80[iso(d)] = 1; else badLt.push(s); });
      if (badLt.length) { res.errors.push(`${line}行目：出勤率8割未満付与日が日付ではありません（${badLt.join(' ')}）`); return; }
      const existing = state.employees.find(e => pad8(e.no) === no);
      res.items.push({ existing, vals: { no: String(Number(noRaw)), name, propDiv: pd, joined: iso(jd), grantAtJoin: grant, regDate, regLeft, regLastYearLeft: regLY, lessThan80: lt80 } });
    });
    res.add = res.items.filter(x => !x.existing).length; res.upd = res.items.filter(x => x.existing).length;
    return res;
  }
  return { error: '取り込めるCSVではありません。\n（社員情報CSV：社員No・氏名・入社年月日、有給取得日CSV：社員No・取得日・日数 の列が必要です）' };
}
function applyCSV(res) {
  if (res.kind === 'usage') {
    for (const it of res.items) { if (it.v) it.emp.usage[it.key] = it.v; else delete it.emp.usage[it.key]; }
  } else {
    let id = nextId();
    for (const it of res.items) {
      if (it.existing) Object.assign(it.existing, it.vals);
      else state.employees.push(Object.assign({ id: id++, division: '', section: '', usage: {} }, it.vals));
    }
  }
  save(); calMonth = null; render();
}
function openCsvImport() {
  const w = openModal({ title: 'CSV取込', cls: 'w-md', body: `<div class="form">
    <div class="frow"><label>CSVファイル</label><input type="file" id="csvFile" accept=".csv,text/csv"></div>
    <div id="csvInfo" class="restore-info"></div>
    <div class="btns right"><button type="button" class="btn primary" id="csvExe" disabled>取込実行</button><button type="button" class="btn" id="csvCancel">キャンセル</button></div></div>` });
  let result = null;
  $('#csvFile', w).addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      result = analyzeCSV(decodeCSV(rd.result));
      const info = $('#csvInfo', w);
      if (result.error) { info.innerHTML = `<div class="err">${esc(result.error).replace(/\n/g, '<br>')}</div>`; $('#csvExe', w).disabled = true; result = null; return; }
      const kindLabel = result.kind === 'usage' ? '有給取得日' : '社員情報';
      const counts = result.kind === 'usage' ? `追加 ${result.add}件・上書き ${result.upd}件・削除 ${result.del}件` : `新規 ${result.add}人・更新 ${result.upd}人`;
      let h = `<table class="kvtable"><tr><th>種別</th><td>${kindLabel}CSV</td></tr><tr><th>ファイル名</th><td>${esc(f.name)}</td></tr><tr><th>取込内容</th><td>${counts}</td></tr><tr><th>エラー</th><td>${result.errors.length}行</td></tr></table>`;
      if (result.errors.length) h += `<div class="err csv-errors">${result.errors.slice(0, 20).map(esc).join('<br>')}${result.errors.length > 20 ? '<br>…' : ''}<br><span class="note">エラー行は取り込まれません</span></div>`;
      info.innerHTML = h;
      $('#csvExe', w).disabled = result.items.length === 0;
    };
    rd.readAsArrayBuffer(f);
  });
  $('#csvCancel', w).addEventListener('click', () => w.close());
  $('#csvExe', w).addEventListener('click', async () => {
    if (!result) return;
    const q = result.kind === 'usage' ? '有給取得日を取り込みます。同じ日付の入力は上書きされます。\nよろしいですか？' : '社員情報を取り込みます。社員Noが同じ社員は上書き更新されます。\nよろしいですか？';
    if (!(await askYesNo(q, '取込確認'))) return;
    applyCSV(result); w.remove();
    await msgBox('取込が完了しました。', '取込完了');
  });
}

state = loadState();
if (!state.settings.company && !state.employees.length) { /* 未設定 */ }
